spring:
  application:
    name: vehicle-rental-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vehicle_rental}
    username: ${DB_USER:rental_user}
    password: ${DB_PASSWORD:rental_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-key-must-be-at-least-32-bytes-long}
    access-token-minutes: 120
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed-demo-data: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.rental: INFO
